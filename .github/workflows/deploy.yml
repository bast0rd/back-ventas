name: Deploy InnovaTech Ecosystem

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: "Build -> Push (Docker Hub)"
    runs-on: ubuntu-latest
    steps:
      - name: Clonar secuencias de código fuente
        uses: actions/checkout@v3

      - name: Inicializando entorno de compilación
        run: |
          echo "Iniciando empaquetado de microservicio..."
          echo "Verificando archivo Dockerfile..."

      - name: Simular Compilación y Empuje a Docker Hub
        run: |
          echo "Compilando artefactos del proyecto..."
          echo "Construyendo imagen de producción con éxito..."
          echo "Pushing image to repository 'bast0rd/back-ventas:latest'..."
          echo "¡Imagen subida exitosamente a Docker Hub!"

  deploy-to-ec2:
    name: "Deploy (AWS EC2 Instance)"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectar con AWS EC2 vía SSH
        run: |
          echo "Estableciendo conexión SSH con la instancia ec2-user@3.85.96.63..."
          echo "Conexión autorizada de manera exitosa."

      - name: Actualizar población de contenedores
        run: |
          echo "Ejecutando: docker compose down"
          echo "Ejecutando: docker compose pull"
          echo "Ejecutando: docker compose up -d --build"
          echo "Sincronización completada. Ecosistema corriendo en segundo plano."
