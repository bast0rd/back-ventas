name: Deploy InnovaTech Ecosystem

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar secuencias de código
        uses: actions/checkout@v3

      - name: Autenticar en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets::DOCKER_USERNAME }}
          password: ${{ secrets::DOCKER_PASSWORD }}

      - name: Compilar y Empujar Imagen de Ventas
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: bast0rd/back-ventas:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectar con AWS EC2 vía SSH y Actualizar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets::EC2_HOST }}
          username: ${{ secrets::EC2_USER }}
          key: ${{ secrets::EC2_SSH_KEY }}
          script: |
            cd ~
            # Detener el ecosistema viejo
            docker compose down
            # Absorber las nuevas secuencias compiladas de Docker Hub
            docker compose pull back-ventas
            # Reactivar la población de contenedores
            docker compose up -d
